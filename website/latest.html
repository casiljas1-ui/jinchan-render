<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>金婵最新网页</title>
  <style>html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#f6f0eb}iframe{display:block}</style>
</head>
<body>
  <iframe id="prototype" src="JINCAN_Full_UI_Prototype.html" title="金婵最新网页"></iframe>
  <script>
    const frame = document.getElementById('prototype');
    let attempts = 0;
    function loadLatest() {
      const doc = frame.contentDocument;
      if (!doc || !doc.body) {
        if (attempts++ < 20) setTimeout(loadLatest, 100);
        return;
      }
      if (doc.getElementById('jinchan-backend-script')) return;
      const script = doc.createElement('script');
      script.id = 'jinchan-backend-script';
      script.src = 'backend.js?v=20260816-step-one-confirm';
      doc.body.appendChild(script);
    }
    frame.addEventListener('load', loadLatest);
    if (frame.contentDocument && frame.contentDocument.readyState === 'complete') loadLatest();
  </script>
</body>
</html>
